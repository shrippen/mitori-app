# PR-Agent settings for Mitori (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# Claude Opus 4.7+ and Claude 5 take no temperature, only adaptive thinking
# with an effort (Opus 5.5 defaults to medium); the effort applies to other
# reasoning models too.
enable_claude_adaptive_thinking = true
reasoning_effort = "high"
# The repository rules and the review guide go along as context.
repo_context_files = ["agent.md", "RULES.md", "REVIEW.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of Mitori: exam programmes of Aikido Shinki Rengo,
Daitoryu and Itto-den Shinki Toho from one source (daten/*.yaml, checked and
converted by tools/daten.py) into a printed LaTeX booklet (heft/) and a
Qt 6 / Kirigami app for Android and Plasma Mobile (app/: qml/ → services/ →
store/, catalog/, player/ → platform/). The PRs are written by an AI agent;
review them as a careful second reader, not as their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Wrong programme data: a technique, grade, order or video time that
  differs from the sources in quellen/ or from daten/*.yaml.
- Data loss: practice log, ratings or notes lost on update, sync, import
  or a migration.
- Leaks: videos, bundle keys or codes in the repository; demo code or data
  in a release build.
- Layer breaches: QML touching SQLite, files or network directly;
  programme data written in code instead of daten/.
- Missing tests for new behaviour; texts missing in one of the catalogs
  (de, en).
- Breaches of the repository rules (agent.md, RULES.md), the GUI rule included.

Label each finding **Wichtig**, **Kleinigkeit** or **Bestand** as REVIEW.md
defines them, at the start of its title.

Skip style, naming and formatting, praise, and guesses you cannot back with
the diff. When you find nothing that matters, say so in one line.
"""
