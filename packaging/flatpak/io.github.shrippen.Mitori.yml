# Flatpak manifest for Mitori (app/). Built locally and in .github/workflows/release.yml, which
# attaches the .flatpak bundle to every GitHub release. Flathub comes later.
#
# Build: flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.shrippen.Mitori.yml
# Run:   flatpak run io.github.shrippen.Mitori

app-id: io.github.shrippen.Mitori
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mitori

finish-args:
  - --share=network        # video bundles, calendar, WebDAV sync
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all           # GPU, and the camera for photos and the DVD's QR code (V4L2; no narrower option reaches it)
  - --socket=pulseaudio    # video sound
  - --talk-name=org.kde.Solid.PowerManagement   # screen brightness (player gesture)

# The app password: in the sandbox libsecret (runtime) keeps it in an encrypted file under the app's
# data, keyed by the Secret portal; that needs no permission. Deliberately no
# --talk-name=org.freedesktop.secrets: it would open all the user's secrets to the app, and with
# the portal libsecret ignores it anyway. Without the portal the settings show a note.
modules:
  # The system's key store (store/secretstore).
  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TESTING=OFF
    cleanup: [/include, /lib/cmake, /mkspecs]
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.17.0.tar.gz
        sha256: 3b85c3929034b0a99da777130c34d99f006fcd3a9d56564159399a33fee0e504

  # tools/daten.py (run by the build); build time only.
  - name: pyyaml
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=/app .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/p/pyyaml/pyyaml-6.0.3.tar.gz
        sha256: d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f

  - name: mitori
    buildsystem: cmake-ninja
    # The build reads the mitori-daten submodule, so the whole repo is the source.
    subdir: app
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.13/site-packages
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - dist
          - build
          - app/build
          - app/build-android
          - .flatpak-builder
    post-install:
      - install -Dm644 /run/build/mitori/packaging/linux/io.github.shrippen.Mitori.desktop /app/share/applications/io.github.shrippen.Mitori.desktop
      - install -Dm644 /run/build/mitori/packaging/linux/io.github.shrippen.Mitori.metainfo.xml /app/share/metainfo/io.github.shrippen.Mitori.metainfo.xml
      - install -Dm644 /run/build/mitori/packaging/linux/io.github.shrippen.Mitori.svg /app/share/icons/hicolor/scalable/apps/io.github.shrippen.Mitori.svg
